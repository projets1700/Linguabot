security:
    password_hashers:
        App\Entity\User:
            algorithm: argon2id

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ROLE_ADMIN inherits every ROLE_USER-gated route: without this, an admin
    # account (role = ROLE_ADMIN only, per the Jalon 3 MPD) would be denied
    # access to the generic ^/api access_control rule below.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Symfony's built-in brute-force guard: limits both per client IP
            # and per IP+submitted-email combination (Symfony's default
            # login rate limiter), so one attacker can't hammer a single
            # account from many IPs either. 5/minute is the value used in
            # Symfony's own security docs as a comfortable human ceiling -
            # a real login rarely needs more than 1-2 tries.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        # Same reasoning as the password hasher override above: every test
        # that exercises a wrong-password case logs in from the same client
        # IP as every other test in the suite, which would otherwise trip
        # the real 5/minute production throttle almost immediately.
        firewalls:
            login:
                login_throttling:
                    max_attempts: 1000
                    interval: '1 minute'
