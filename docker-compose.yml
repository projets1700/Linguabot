services:
  database:
    image: postgres:16-alpine
    container_name: linguabot_database
    environment:
      POSTGRES_DB: linguabot
      POSTGRES_USER: linguabot_user
      POSTGRES_PASSWORD: linguabot_password
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguabot_user -d linguabot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: linguabot_mailpit
    ports:
      - "8025:8025" # web UI: http://localhost:8025
      - "1025:1025" # SMTP

  backend:
    build:
      context: ./backend
    container_name: linguabot_backend
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/app
      - backend_var:/app/var
      - backend_vendor:/app/vendor
    environment:
      # APP_ENV is intentionally not set here: .env already defaults to
      # "dev", and a real process env var here would outrank phpunit's own
      # env override when running tests via `docker exec ... php bin/phpunit`.
      DATABASE_URL: "postgresql://linguabot_user:linguabot_password@database:5432/linguabot?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailpit:1025"

  frontend:
    build:
      context: ./frontend
    container_name: linguabot_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      VITE_API_URL: "http://localhost:8080/api"
    depends_on:
      - backend

volumes:
  database_data:
  backend_var:
  backend_vendor:
  frontend_node_modules:
